# ---------------------------------------------------------------------------
#  Electric Soup — site settings
#
#  If you're running `bundle exec jekyll serve`, restart it after editing
#  this file (it is NOT reloaded automatically).
#  How to write posts, add series, etc. lives in README.md.
# ---------------------------------------------------------------------------

title: Electric Soup
description: Electrical engineering, DSP, music tech, and whatever else I'm learning.
author: Nathan Touchet
email: ndtouchet@proton.me
github_username: ntouchet
lang: en
timezone: America/Chicago

url: "https://ntouchet.github.io"
baseurl: ""

# How many posts the home page lists under "Recent posts".
recent_posts: 10

# Post URLs are built from the folder the post lives in, e.g.
#   academics/dsp-smith/_posts/2026-01-10-chapter-4.md -> /academics/dsp-smith/chapter-4/
permalink: /:categories/:slug/

markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
highlighter: rouge

# Only plugins GitHub Pages allows: https://pages.github.com/versions/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Every post gets the post layout and every page the page layout unless it
# says otherwise, so you never have to type `layout:` yourself.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page

exclude:
  - README.md
  - new-post
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .jekyll-cache
