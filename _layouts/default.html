<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
{%- include head.html %}
<body id="top">
  <a class="skip-link" href="#main">Skip to content</a>
  {% include gif-column.html side="left" %}
  {% include gif-column.html side="right" %}

  <div class="page">
    {% include header.html %}

    <main id="main" class="window">
      <div class="window__titlebar">
        <h1 class="window__title">{{ page.title | default: site.title | escape }}</h1>
        <div class="window__buttons" aria-hidden="true">
          <span class="btn-min"></span><span class="btn-max"></span><span class="btn-close"></span>
        </div>
      </div>
      <div class="window__body">
        {{ content }}
      </div>
    </main>

    {% include footer.html %}
  </div>
</body>
</html>
